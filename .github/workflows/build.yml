name: Build binaries

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (leave empty to only keep artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04,   name: linux }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          fi

      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests

      - name: Build with PyInstaller
        shell: bash
        env:
          # Set these two repository secrets to ship a signed Windows build. Without them the build is
          # unsigned and SmartScreen will warn about an unknown publisher - see README, "Windows says the app
          # is not safe". Any Authenticode certificate works (Azure Trusted Signing, SignPath, Certum, EV...).
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_PFX_BASE64" ]; then
            echo "$WINDOWS_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            SIGNTOOL=$(cygpath -w "$(ls -1 "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)")
            echo "Signing with $SIGNTOOL"
            export SIGN_COMMAND="\"$SIGNTOOL\" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f \"$(cygpath -w "$RUNNER_TEMP/cert.pfx")\" /p \"$WINDOWS_PFX_PASSWORD\" {file}"
          fi
          python build.py
          rm -f "$RUNNER_TEMP/cert.pfx"

      # Windows code signing through SignPath (free for open-source projects): the packaged .zip is submitted,
      # SignPath signs whisperer.exe inside it and sends the archive back. Skipped entirely until the
      # SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable are set, so an unconfigured fork
      # still builds. The slugs below must match the project set up in SignPath.
      - name: Upload the unsigned Windows archive for signing
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: whisperer-windows-unsigned
          path: dist/*.zip
          if-no-files-found: error

      - name: Sign the Windows archive (SignPath)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: whisperer
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Refresh the checksum of the signed archive
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: python build.py --checksum dist/*.zip

      - name: Smoke-test the frozen build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ffmpeg espeak-ng
          # real speech, and an audio stream that starts 1.5 s after the video (the offset bug fixed in 1.3):
          # the self-test generates subtitles (VAD-snapped), then shifts them by 2 s and resyncs them back.
          espeak-ng -v en -s 150 -w /tmp/speech.wav "The quick brown fox jumps over the lazy dog. She sells sea shells by the sea shore. Peter Piper picked a peck of pickled peppers. How much wood would a woodchuck chuck if a woodchuck could chuck wood."
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=160x120:rate=5 -itsoffset 1.5 -i /tmp/speech.wav -map 0:v -map 1:a -t 16 -c:v libx264 -c:a aac /tmp/smoke.mkv
          mkdir -p /tmp/frozen && tar xzf dist/*.tar.gz -C /tmp/frozen
          QT_QPA_PLATFORM=offscreen WHISPERER_SELFTEST=/tmp/smoke.mkv timeout 900 /tmp/frozen/*/whisperer
          head -4 /tmp/smoke.srt
          # first cue must start after the 1.5 s audio lead, not at 0
          python3 -c "import re,sys; t=open('/tmp/smoke.srt').read(); m=re.search(r'00:00:(\d\d),(\d{3}) -->', t); s=int(m.group(1))+int(m.group(2))/1000; print('first cue at', s); sys.exit(0 if 1.2 <= s <= 2.2 else 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: whisperer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
