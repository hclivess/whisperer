name: Build binaries

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (leave empty to only keep artifacts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-22.04,   name: linux }
          - { os: macos-latest,   name: macos }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka zstandard ordered-set
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ccache patchelf libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
            python -m pip install patchelf
          fi

      - name: Build with Nuitka
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: whisperer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
